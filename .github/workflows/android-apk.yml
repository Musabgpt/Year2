name: Build Android APK

on:
  push:
    branches: ["feat/godot-adventure-foundation"]
    paths:
      - "game/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare reproducible Android export environment
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/lib/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p game/build "$HOME/.local/share/godot/export_templates/4.3.stable" "$HOME/.config/godot" "$HOME/.android"

          # Install the SDK components Godot's Android exporter actually needs.
          SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313" "cmake;3.10.2.4988404"

          # Install the exact export templates matching the pinned Godot 4.3 engine.
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

          JAVA_BIN="$(readlink -f "$(command -v java)")"
          JAVA_HOME_DIR="$(dirname "$(dirname "$JAVA_BIN")")"
          echo "JAVA_HOME=$JAVA_HOME_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          # Fail early with a useful diagnostic rather than a generic export error.
          test -x "$JAVA_HOME_DIR/bin/java"
          test -f "$ANDROID_HOME/platforms/android-33/android.jar"
          test -d "$ANDROID_HOME/build-tools/33.0.2"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -s "$HOME/.android/debug.keystore"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"

      - name: Validate project scripts
        run: godot --headless --editor --path game --quit --verbose

      - name: Export debug APK
        shell: bash
        run: |
          set -euxo pipefail
          # Run the export as a standalone headless process; do not combine --editor and --export.
          godot --headless --path game --export-debug "Android" build/Year2Adventure.apk --verbose

      - name: Verify APK exists and is a valid ZIP
        shell: bash
        run: |
          set -euxo pipefail
          test -s game/build/Year2Adventure.apk
          unzip -t game/build/Year2Adventure.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Year2Adventure-Android-APK
          path: game/build/Year2Adventure.apk
          if-no-files-found: error
          retention-days: 14
