name: Android APK

on:
  push:
    branches: ["main", "feat/year2-adventure-academy-apk"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Test Rust and build Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Run Rust tests
        run: cargo test --locked

      - name: Install APK packager
        run: cargo install cargo-quad-apk --locked

      - name: Build release APK
        run: cargo quad-apk build --release

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find target -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: year2-adventure-academy-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
